<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification settings</title>
<!-- WCAG 4.1.2 Name, Role, Value: the barrier. Each switch is a <div> that works with a mouse and with
     the keyboard (Tab, then Space or Enter), but tells assistive technology nothing: no name, no role,
     no on/off state. Its label is a separate <span> beside it, and its state is only a colour. -->
<style>
  :root { color-scheme: light; --ink: #1b1f24; --muted: #57606a; --line: #d0d7de; --on: #1a7f37; --off: #8c959f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 22px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--ink); background: #f6f8fa; }
  main { max-width: 760px; margin: 72px auto; padding: 40px 48px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .back { display: inline-block; margin-bottom: 16px; color: #0969da; }
  h1 { margin: 0 0 8px; font-size: 36px; }
  p { margin: 0 0 32px; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 0; border-top: 1px solid var(--line); }
  .switch { position: relative; flex: none; width: 72px; height: 40px; border-radius: 20px; background: var(--off); cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--on); }
  .switch.on::after { left: 36px; }
  .switch:focus-visible { outline: 3px solid #0969da; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <a class="back" href="#">Back to account</a>
  <h1>Notifications</h1>
  <p>Choose what we email you about.</p>
  <div class="row">
    <span>Replies to my comments</span>
    <div class="switch on" tabindex="0"></div>
  </div>
  <div class="row">
    <span>Weekly digest</span>
    <div class="switch" tabindex="0"></div>
  </div>
</main>
<script>
  for (const s of document.querySelectorAll('.switch')) {
    s.addEventListener('click', () => s.classList.toggle('on'))
    s.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); s.classList.toggle('on') }
    })
  }
</script>
</body>
</html>
