<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarterly report</title>
<!-- WCAG 1.1.1 Non-text Content: the barrier. The chart is an image with no alt attribute, so the only
     thing a screen reader has to go on is its file name. Everything it shows is in the picture alone. -->
<style>
  :root { color-scheme: light; --ink: #1b1f24; --muted: #57606a; --line: #d0d7de; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 22px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--ink); background: #f6f8fa; }
  main { max-width: 820px; margin: 56px auto; padding: 40px 48px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .back { display: inline-block; margin-bottom: 16px; color: #0969da; }
  h1 { margin: 0 0 8px; font-size: 36px; }
  p { margin: 0 0 24px; color: var(--muted); }
  a:focus-visible { outline: 3px solid #0969da; outline-offset: 3px; }
  img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
</style>
</head>
<body>
<main>
  <a class="back" href="#">Back to reports</a>
  <h1>Quarterly report</h1>
  <p>How sales went from July to September.</p>
  <img src="q3-sales.svg" width="640" height="360">
</main>
</body>
</html>
