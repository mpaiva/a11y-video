<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification settings</title>
<!-- WCAG 4.1.2 Name, Role, Value: the fix. Each switch is a <button> (a role, and Space and Enter for
     free) with role="switch" and aria-checked (its state), named by the text beside it through
     aria-labelledby. The look is unchanged: the colour now follows aria-checked. -->
<style>
  :root { color-scheme: light; --ink: #1b1f24; --muted: #57606a; --line: #d0d7de; --on: #1a7f37; --off: #8c959f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 22px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--ink); background: #f6f8fa; }
  main { max-width: 760px; margin: 72px auto; padding: 40px 48px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .back { display: inline-block; margin-bottom: 16px; color: #0969da; }
  h1 { margin: 0 0 8px; font-size: 36px; }
  p { margin: 0 0 32px; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 0; border-top: 1px solid var(--line); }
  .switch { position: relative; flex: none; width: 72px; height: 40px; padding: 0; border: 0; border-radius: 20px; background: var(--off); cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--on); }
  .switch[aria-checked="true"]::after { left: 36px; }
  .switch:focus-visible { outline: 3px solid #0969da; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <a class="back" href="#">Back to account</a>
  <h1>Notifications</h1>
  <p>Choose what we email you about.</p>
  <div class="row">
    <span id="replies">Replies to my comments</span>
    <button class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="replies"></button>
  </div>
  <div class="row">
    <span id="digest">Weekly digest</span>
    <button class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="digest"></button>
  </div>
</main>
<script>
  for (const s of document.querySelectorAll('.switch')) {
    s.addEventListener('click', () => s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true')))
  }
</script>
</body>
</html>
